# Analyse du jour, chaque nuit à 00 h 10 (heure de Paris), sur les serveurs gratuits de GitHub.
name: Analyse du jour

on:
  schedule:
    - cron: '10 22 * * *'   # 00 h 10 en heure d'été (UTC+2)
    - cron: '10 23 * * *'   # 00 h 10 en heure d'hiver (UTC+1)
    # GitHub retarde parfois les tâches planifiées de plusieurs heures : déclenchements de secours,
    # chacun ne fait rien si l'analyse du jour est déjà publiée
    - cron: '40 23 * * *'
    - cron: '25 0 * * *'
    - cron: '25 1 * * *'
    - cron: '25 2 * * *'
    - cron: '25 3 * * *'
    - cron: '25 4 * * *'
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: donnees
  cancel-in-progress: false

env:
  TZ: Europe/Paris
  FEUILLE_CLOUD: '1'
  FEUILLE_RESULTATS: en-ligne

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Analyse du jour déjà faite ?
        id: heure
        run: |
          h=$(date +%H)
          jour=$(date +%Y%m%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          elif [ "$h" -ge 7 ] && [ "$h" -le 22 ]; then
            echo "Il est $h h à Paris : hors de la plage de nuit (0 h - 7 h), on passe."
          elif [ "$h" -eq 23 ]; then
            echo "Il est 23 h à Paris (heure d'été/hiver) : trop tôt, on passe."
          elif [ -f "en-ligne/$jour.json" ]; then
            echo "Analyse du $jour déjà publiée, rien à faire."
          else
            echo "Il est $h h à Paris et l'analyse du $jour n'est pas faite : on lance."
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.heure.outputs.go == '1'
        with:
          python-version: '3.12'

      - name: Données déjà téléchargées les nuits précédentes
        if: steps.heure.outputs.go == '1'
        uses: actions/cache@v4
        with:
          path: |
            cache
            profil-auto
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-

      - name: Collecte API-Football (tous les matchs proposés par les bookmakers)
        if: steps.heure.outputs.go == '1'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python collecte_api.py

      - name: Analyse (navigateur invisible)
        if: steps.heure.outputs.go == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python auto.py --quitter-serveur && cat en-ligne/auto.log | tail -3

      - name: Publication de la sélection
        if: steps.heure.outputs.go == '1'
        run: |
          git config user.name "feuille-du-jour"
          git config user.email "feuille-du-jour@users.noreply.github.com"
          rm -f en-ligne/erreur-auto.txt
          # garde 14 jours d'analyses
          ls en-ligne/2*.json 2>/dev/null | sort | head -n -14 | xargs -r rm -f
          git add -A en-ligne
          git commit -m "Analyse du $(date +%d/%m/%Y)" || exit 0
          git pull --rebase
          git push
